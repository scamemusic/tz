<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Задачи на монтаж — Scame Project</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
@font-face { font-family: "InterLocal"; src: url("fonts/Inter.ttf") format("truetype"); font-weight: 100 900; font-display: swap; }
@font-face { font-family: "MonoLocal"; src: url("fonts/JetBrainsMono.ttf") format("truetype"); font-weight: 100 800; font-display: swap; }

/* те же токены, что в CRM: белое стекло, точки на холсте, моно-подписи */
:root {
  --sans: "InterLocal", "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
  --mono: "MonoLocal", "Cascadia Mono", Consolas, ui-monospace, monospace;
  --page: #e8e8eb; --canvas: #f4f4f6;
  --text: #1d1d1f; --text-2: #3a3a3c; --muted: #6e6e73; --faint: #a1a1a6;
  --line: rgba(0, 0, 0, .08); --fill: rgba(0, 0, 0, .045);
  --accent: #007aff; --money: #248a3d; --due: #c25e00; --late: #e5372c;
  --g-work: #23a54a; --g-work-soft: rgba(52, 199, 89, .15);
  --g-done: #0a7aff; --g-done-soft: rgba(0, 122, 255, .12);
  --glass: rgba(255, 255, 255, .62);
  --glass-rim: inset 0 0 0 1px rgba(255, 255, 255, .75), 0 0 0 .5px rgba(0, 0, 0, .08);
  --shadow: 0 1px 2px rgba(0, 0, 0, .04), 0 12px 32px rgba(20, 20, 40, .07);
  --shadow-lg: 0 2px 8px rgba(0, 0, 0, .06), 0 34px 80px rgba(20, 20, 45, .18);
  --ink: linear-gradient(180deg, #3b3b3f 0%, #19191b 52%, #0c0c0d 100%);
  --ink-shadow: inset 0 1px 0 rgba(255, 255, 255, .24), inset 0 -1px 0 rgba(0, 0, 0, .5), 0 1px 2px rgba(0, 0, 0, .22), 0 6px 16px rgba(0, 0, 0, .2);
  --spring: cubic-bezier(.34, 1.36, .64, 1); --ease: cubic-bezier(.2, .8, .2, 1);
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  min-height: 100vh; color: var(--text); font: 14px/1.45 var(--sans); -webkit-font-smoothing: antialiased;
  background: radial-gradient(rgba(0, 0, 0, .11) 1px, transparent 1.2px) 0 0 / 22px 22px, var(--canvas);
}
button, input, textarea { font: inherit; color: inherit; }
a { color: var(--accent); text-decoration: none; word-break: break-all; }
a:hover { text-decoration: underline; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; letter-spacing: -.01em; }

.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 18px 26px; }
.brand { display: inline-flex; align-items: center; gap: 9px; font-weight: 760; font-size: 16px; letter-spacing: -.02em; white-space: nowrap; }
.brand svg { width: 24px; height: 21px; filter: drop-shadow(0 1px 1px rgba(0, 0, 0, .18)); }
.brand small { font: 600 10px/1 var(--mono); letter-spacing: .16em; color: var(--muted); padding: 4px 6px 3px 7px; border-radius: 6px; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .13); }
.who { font: 600 11px/1 var(--mono); letter-spacing: .08em; color: var(--muted); text-transform: uppercase; }

main { max-width: 1120px; margin: 0 auto; padding: 12px 24px 80px; }
.hero { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin: 18px 0 30px; }
.hero h1 { margin: 0; font-size: clamp(26px, 4vw, 38px); letter-spacing: -.035em; line-height: 1.05; font-weight: 760; }
.hero p { margin: 8px 0 0; color: var(--muted); }
.add {
  position: relative; overflow: hidden; flex: none; display: inline-flex; align-items: center; gap: 10px;
  height: 48px; padding: 0 22px 0 16px; border: 0; border-radius: 15px; cursor: pointer;
  color: #fff; font-weight: 650; font-size: 15px; background: var(--ink); box-shadow: var(--ink-shadow);
  transition: transform .35s var(--spring);
}
.add b { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 9px; background: #fff; color: #111; font-size: 20px; font-weight: 500; line-height: 1; transition: transform .45s var(--spring); }
.add:hover { transform: translateY(-2px); }
.add:hover b { transform: rotate(90deg); }
.add::after { content: ""; position: absolute; inset: 0; background: linear-gradient(105deg, transparent 30%, rgba(255, 255, 255, .22) 50%, transparent 70%); transform: translateX(-130%); transition: transform .8s var(--ease); }
.add:hover::after { transform: translateX(130%); }

.sec { margin-top: 34px; }
.sec-head { display: flex; align-items: center; gap: 9px; margin: 0 4px 14px; font-weight: 700; font-size: 16px; letter-spacing: -.01em; }
.sec-head i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); box-shadow: 0 0 0 3px var(--cs); }
.sec-head .cnt { font: 600 11px/1 var(--mono); color: var(--c); background: var(--cs); padding: 4px 7px; border-radius: 7px; }
.work { --c: var(--g-work); --cs: var(--g-work-soft); }
.done { --c: var(--g-done); --cs: var(--g-done-soft); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 22px 18px; }

/* карточка-папка: ушко сверху слева, стеклянная створка */
.card {
  position: relative; text-align: left; border: 0; padding: 0; cursor: pointer; background: none; margin-top: 12px;
  transition: transform .45s var(--spring); animation: rise .5s var(--ease) both; animation-delay: calc(var(--i) * 35ms);
}
.card::before {
  content: ""; position: absolute; left: 0; top: -12px; width: 42%; height: 24px; border-radius: 12px 14px 0 0;
  background: linear-gradient(180deg, color-mix(in srgb, var(--cs) 100%, #fff 40%), rgba(255, 255, 255, .5));
  box-shadow: var(--glass-rim);
}
.card .face {
  position: relative; display: flex; flex-direction: column; gap: 10px; min-height: 128px; padding: 16px 16px 14px;
  border-radius: 4px 18px 18px 18px; background: var(--glass); box-shadow: var(--glass-rim), var(--shadow);
  backdrop-filter: blur(18px) saturate(1.6); -webkit-backdrop-filter: blur(18px) saturate(1.6);
}
.card:hover { transform: translateY(-4px) rotate(-.4deg); }
.card:hover .face { box-shadow: var(--glass-rim), var(--shadow-lg); }
.card h3 { margin: 0; font-size: 16px; line-height: 1.25; letter-spacing: -.015em; font-weight: 680; }
.card .snip { color: var(--muted); font-size: 13px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.meta { margin-top: auto; display: flex; align-items: center; justify-content: space-between; gap: 8px; font: 500 11.5px/1 var(--mono); color: var(--muted); }
.chip { padding: 5px 8px 4px; border-radius: 7px; background: var(--fill); white-space: nowrap; }
.chip.soon { color: var(--due); background: rgba(255, 149, 0, .13); }
.chip.late { color: var(--late); background: rgba(255, 59, 48, .12); }
.price { color: var(--money); font-weight: 650; }
.done .card h3 { color: var(--text-2); }
.empty { padding: 26px; border-radius: 18px; text-align: center; color: var(--muted); background: rgba(255, 255, 255, .45); box-shadow: var(--glass-rim); }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } }

/* окно */
.veil { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; padding: 18px; background: rgba(240, 240, 244, .55); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); animation: fade .25s both; }
.sheet {
  width: min(640px, 100%); max-height: calc(100vh - 36px); overflow: auto; border-radius: 22px; padding: 24px;
  background: rgba(255, 255, 255, .92); box-shadow: var(--glass-rim), var(--shadow-lg); animation: pop .45s var(--spring) both;
}
.sheet h2 { margin: 0 0 4px; font-size: 22px; letter-spacing: -.025em; line-height: 1.2; }
.sheet .sub { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 18px; font: 500 11.5px/1 var(--mono); color: var(--muted); }
.tz { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 14px; line-height: 1.55; color: var(--text-2); padding: 16px; border-radius: 14px; background: var(--fill); }
label { display: block; margin: 14px 0 6px; font: 600 10.5px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
input, textarea { width: 100%; border: 0; border-radius: 12px; padding: 11px 13px; background: var(--fill); box-shadow: inset 0 0 0 1px var(--line); outline: none; transition: box-shadow .2s, background .2s; }
input:focus, textarea:focus { background: #fff; box-shadow: inset 0 0 0 1.5px var(--accent), 0 0 0 4px rgba(0, 122, 255, .12); }
textarea { min-height: 220px; resize: vertical; line-height: 1.5; }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.btns { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; margin-top: 20px; }
.btn { height: 40px; padding: 0 16px; border: 0; border-radius: 12px; cursor: pointer; font-weight: 620; background: var(--fill); transition: background .2s, transform .3s var(--spring); }
.btn:hover { background: rgba(0, 0, 0, .08); transform: translateY(-1px); }
.btn.primary { color: #fff; background: var(--ink); box-shadow: var(--ink-shadow); }
.btn.red { color: var(--late); margin-right: auto; }
.err { color: var(--late); font-size: 13px; margin-top: 10px; min-height: 1em; }
@keyframes fade { from { opacity: 0; } }
@keyframes pop { from { opacity: 0; transform: translateY(14px) scale(.97); } }

@media (max-width: 640px) {
  .top { padding: 14px 16px; }
  main { padding: 6px 16px 60px; }
  .hero { flex-direction: column; align-items: stretch; }
  .add { justify-content: center; }
  .row { grid-template-columns: 1fr; }
  .sheet { padding: 20px 18px; }
}
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <svg viewBox="0 0 26 22" aria-hidden="true">
      <path d="M3 5.2C3 3.4 4.4 2 6.2 2h4.1c.9 0 1.7.4 2.3 1l1.3 1.4h6.9c1.8 0 3.2 1.4 3.2 3.2V9H3z" fill="#9a9aa2"/>
      <path d="M1.6 10.6c0-1.3 1-2.3 2.3-2.3h18.2c1.3 0 2.3 1 2.3 2.3l-.6 7.2c-.1 1.7-1.5 3-3.2 3H5.4c-1.7 0-3.1-1.3-3.2-3z" fill="#141416"/>
      <path d="M5 11.4h16" stroke="#fff" stroke-opacity=".28" stroke-width="1.2" stroke-linecap="round"/>
    </svg>
    SCAME PROJECT<small>ТЗ</small>
  </div>
  <span class="who" id="who"></span>
</header>

<main>
  <section class="hero">
    <div>
      <h1>Задачи на монтаж</h1>
      <p>Добавьте ролик плюсиком: ТЗ, ссылки на исходники и дедлайн.</p>
    </div>
    <button class="add" id="add"><b>+</b>Новая задача</button>
  </section>

  <section class="sec work">
    <div class="sec-head"><i></i>В работе <span class="cnt" id="nWork">0</span></div>
    <div class="grid" id="work"></div>
  </section>
  <section class="sec done">
    <div class="sec-head"><i></i>Выполнено <span class="cnt" id="nDone">0</span></div>
    <div class="grid" id="done"></div>
  </section>
</main>

<script>
// на GitHub Pages: scamemusic.github.io/tz/?b=<доска>, данные — с сервера; локально: 127.0.0.1:8766/<доска>
const qs = new URLSearchParams(location.search);
const onPages = location.hostname.endsWith('github.io');
const BASE = onPages ? 'https://tz.2-26-103-210.nip.io' : '';
const slug = qs.get('b') || (onPages ? '' : location.pathname.split('/').filter(Boolean)[0]);
const key = qs.get('key') || '';
const api = (id = '') => `${BASE}/api/${slug}/tasks${id ? '/' + id : ''}${key ? '?key=' + encodeURIComponent(key) : ''}`;
let state = { tasks: [], admin: false };

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const linkify = (s) => esc(s).replace(/https?:\/\/[^\s<]+/g, (u) => `<a href="${u}" target="_blank" rel="noopener">${u}</a>`);
const MON = ['янв', 'фев', 'мар', 'апр', 'мая', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];
const fmt = (iso) => { if (!iso) return ''; const d = new Date(iso); return `${d.getDate()} ${MON[d.getMonth()]}, ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`; };
const fmtDay = (iso) => { if (!iso) return ''; const d = new Date(iso); return `${d.getDate()} ${MON[d.getMonth()]}`; };
const rub = (n) => n ? new Intl.NumberFormat('ru-RU').format(n) + ' ₽' : '';

function due(t) {
  if (!t.deadline) return { cls: '', text: 'без дедлайна' };
  const left = new Date(t.deadline) - Date.now();
  if (left < 0) return { cls: 'late', text: 'до ' + fmt(t.deadline) };
  return { cls: left < 864e5 ? 'soon' : '', text: 'до ' + fmt(t.deadline) };
}

function card(t, i) {
  const isDone = t.status === 'done';
  const chip = isDone ? `<span class="chip">сдано ${fmtDay(t.doneAt)}</span>` : (({ cls, text }) => `<span class="chip ${cls}">${text}</span>`)(due(t));
  return `<button class="card" data-id="${t.id}" style="--i:${i}"><div class="face">
    <h3>${esc(t.title)}</h3>
    ${t.tz ? `<div class="snip">${esc(t.tz.slice(0, 220))}</div>` : ''}
    <div class="meta">${chip}<span class="price">${rub(t.price)}</span></div>
  </div></button>`;
}

function render() {
  document.getElementById('who').textContent = state.client || '';
  const work = state.tasks.filter((t) => t.status !== 'done')
    .sort((a, b) => (a.deadline || '9999').localeCompare(b.deadline || '9999'));
  const done = state.tasks.filter((t) => t.status === 'done')
    .sort((a, b) => (b.doneAt || '').localeCompare(a.doneAt || ''));
  document.getElementById('nWork').textContent = work.length;
  document.getElementById('nDone').textContent = done.length;
  document.getElementById('work').innerHTML = work.map(card).join('') || '<div class="empty">Сейчас задач нет — добавьте новую плюсиком</div>';
  document.getElementById('done').innerHTML = done.map(card).join('') || '<div class="empty">Пока пусто</div>';
}

async function call(method, id, body) {
  const r = await fetch(api(id), { method, headers: { 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || 'Не получилось сохранить, попробуйте ещё раз');
  state = j; render();
}

function modal(html) {
  const v = document.createElement('div');
  v.className = 'veil';
  v.innerHTML = `<div class="sheet">${html}</div>`;
  v.addEventListener('mousedown', (e) => { if (e.target === v) v.remove(); });
  document.body.append(v);
  return v;
}
addEventListener('keydown', (e) => { if (e.key === 'Escape') document.querySelector('.veil')?.remove(); });

function form(t) {
  const v = modal(`<h2>${t ? 'Изменить задачу' : 'Новая задача'}</h2>
    <label for="fTitle">Название</label><input id="fTitle" maxlength="200" placeholder="Например: Свадебное путешествие" value="${esc(t?.title)}">
    <label for="fTz">ТЗ</label><textarea id="fTz" placeholder="Хук, тайм-коды, ссылки на исходники и материалы, пожелания по монтажу">${esc(t?.tz)}</textarea>
    <div class="row">
      <div><label for="fDate">Дедлайн — дата</label><input id="fDate" type="date" value="${(t?.deadline || '').slice(0, 10)}"></div>
      <div><label for="fTime">Время</label><input id="fTime" type="time" value="${(t?.deadline || '').slice(11, 16)}"></div>
    </div>
    <div class="err" id="fErr"></div>
    <div class="btns"><button class="btn" data-x>Отмена</button><button class="btn primary" id="fSave">${t ? 'Сохранить' : 'Добавить задачу'}</button></div>`);
  v.querySelector('#fTitle').focus();
  v.querySelector('[data-x]').onclick = () => v.remove();
  v.querySelector('#fSave').onclick = async () => {
    const date = v.querySelector('#fDate').value, time = v.querySelector('#fTime').value;
    const body = { title: v.querySelector('#fTitle').value, tz: v.querySelector('#fTz').value, deadline: date ? `${date}T${time || '23:59'}` : '' };
    try { await call(t ? 'PATCH' : 'POST', t?.id, body); v.remove(); } catch (e) { v.querySelector('#fErr').textContent = e.message; }
  };
}

function open(t) {
  const isDone = t.status === 'done';
  const d = due(t);
  const admin = state.admin ? `
    <label for="fPrice">Цена, ₽</label><input id="fPrice" inputmode="numeric" value="${t.price ?? ''}" style="max-width:160px">
    <div class="btns"><button class="btn red" id="aDel">Удалить</button>
      <button class="btn" id="aPrice">Сохранить цену</button>
      <button class="btn primary" id="aStatus">${isDone ? 'Вернуть в работу' : 'Отметить выполненной'}</button></div>` : '';
  const v = modal(`<h2>${esc(t.title)}</h2>
    <div class="sub">${isDone ? `<span class="chip">сдано ${fmtDay(t.doneAt)}</span>` : `<span class="chip ${d.cls}">${d.text}</span>`}
      ${t.price ? `<span class="chip price">${rub(t.price)}</span>` : ''}</div>
    <div class="tz">${t.tz ? linkify(t.tz) : '<span style="color:var(--faint)">ТЗ пока пустое</span>'}</div>
    <div class="btns"><button class="btn" data-x>Закрыть</button>${isDone ? '' : '<button class="btn" id="edit">Изменить</button>'}</div>${admin}`);
  v.querySelector('[data-x]').onclick = () => v.remove();
  const ed = v.querySelector('#edit'); if (ed) ed.onclick = () => { v.remove(); form(t); };
  if (state.admin) {
    v.querySelector('#aStatus').onclick = async () => { await call('PATCH', t.id, { status: isDone ? 'active' : 'done' }); v.remove(); };
    v.querySelector('#aPrice').onclick = async () => { await call('PATCH', t.id, { price: v.querySelector('#fPrice').value.replace(/\D/g, '') }); v.remove(); };
    v.querySelector('#aDel').onclick = async () => { if (confirm('Удалить задачу?')) { await call('DELETE', t.id); v.remove(); } };
  }
}

document.getElementById('add').onclick = () => form();
document.addEventListener('click', (e) => {
  const c = e.target.closest('.card'); if (!c) return;
  const t = state.tasks.find((x) => x.id === c.dataset.id); if (t) open(t);
});

async function load() {
  const r = await fetch(api()); if (r.ok) { state = await r.json(); render(); }
}
load();
setInterval(() => { if (!document.querySelector('.veil') && !document.hidden) load(); }, 20000);
</script>
</body>
</html>
